<!DOCTYPE html>
<html>
<head>
    <title>Add Listing - BashaShare BD</title>
</head>

<body>

<h1>Add Accommodation</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('add_listing') }}">

    <label>Title:</label>
    <input type="text" name="title" id="title" required>

    <br><br>

    <label>Location:</label>
    <input type="text" name="location" id="location" required>

    <br><br>

    <label>Monthly Rent:</label>
    <input type="number" name="rent" id="rent" required>

    <br><br>

    <label>Description:</label>
    <textarea name="description" id="description" required></textarea>

    <br><br>

    <input type="submit" id="add-listing-btn" value="Submit Listing">
</form>

<br>

<a href="{{ url_for('listings') }}">View Listings</a> |
<a href="{{ url_for('dashboard') }}">Dashboard</a>

</body>
</html>
